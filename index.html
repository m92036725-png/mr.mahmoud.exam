<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مستر محمود">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستر محمود خاطر | English</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fc;color:#18213b;font-family:Tahoma,Arial;transition:background .25s,color .25s}
header{background:linear-gradient(120deg,#101b3d,#3157d5);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{background:#28c6c9;padding:12px 17px;border-radius:14px;font-size:24px;font-weight:bold}
header h2{margin:0;font-size:19px}
nav{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:bold;font-family:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
nav button{background:#ffffff20;color:white}
.primary{background:#3157d5;color:white}
.secondary{background:#e9efff;color:#3157d5}
.danger{background:#ffe9ed;color:#d94b63}
.success{background:#e7f8ef;color:#16845b}
main{max-width:1100px;margin:28px auto;padding:0 15px}
.hero{background:white;padding:30px;border-radius:22px;display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:center}
.hero h1{font-size:30px;color:#101b3d}
.hero p,.muted{color:#77819a}
.hero-art{background:linear-gradient(140deg,#172653,#3157d5);color:white;text-align:center;padding:30px;border-radius:20px}
.hero-art strong{font-size:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin:22px 0}
.card,.panel,.exam{background:white;padding:20px;border-radius:16px;border:1px solid #e7ebf5;margin-bottom:15px}
.hidden{display:none!important}
label{display:block;margin:12px 0 6px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #dce2ef;border-radius:10px;font:inherit;background:white;color:#18213b}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{background:#edf1ff;color:#3157d5;padding:5px 10px;border-radius:20px;font-size:12px}
.stat{font-size:30px;color:#3157d5;font-weight:bold}
.question{border:1px solid #e5eaf5;padding:16px;border-radius:13px;margin:15px 0}
.option{display:flex;gap:10px;align-items:center;font-weight:normal}
.option input{width:auto}
.notice{background:#edf3ff;padding:13px;border-radius:10px;margin:12px 0}
.passage{background:#fff8e8;padding:15px;border-radius:12px;line-height:1.9;margin:12px 0}
footer{text-align:center;padding:25px;color:#77819a}
hr{border:0;border-top:1px solid #e7ebf5;margin:18px 0}
.small{font-size:13px;color:#77819a}
.duration-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.duration-item{background:#f7f8fc;padding:10px;border-radius:10px}
.answer-review{background:#f7f8fc;padding:13px;border-radius:10px;margin:10px 0}
.builder-box{background:#f7f8fc;padding:14px;border-radius:12px;margin:12px 0;border:1px solid #e5eaf5}
.dialog-line{background:white;padding:12px;border:1px solid #e5eaf5;border-radius:10px;margin:10px 0}
.word-choice{display:inline-block;background:#e9efff;color:#3157d5;padding:8px 12px;margin:4px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.word-choice.selected{border-color:#3157d5;background:#dce6ff}
.dialog-person{font-weight:bold;color:#3157d5}

/* المترجم */
.translator-card{background:white;padding:25px;border-radius:20px;border:1px solid #e7ebf5;max-width:750px;margin:25px auto;box-shadow:0 8px 25px #18213b0a}
.translator-title{color:#172653;text-align:center;font-size:26px}
.translator-ribbon{display:inline-block;background:#e53950;color:white;padding:6px 18px;border-radius:6px;font-size:12px;font-weight:bold;margin:8px;transform:rotate(-4deg)}
.translator-result{background:#f3f6ff;padding:18px;border-radius:12px;min-height:100px;margin-top:15px;font-size:19px;line-height:1.8;color:#172653;white-space:pre-wrap;overflow-wrap:anywhere}
.translator-switch{background:#edf1ff;color:#3157d5;font-size:20px;padding:9px 17px}
.translator-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.translator-actions button{flex:1;min-width:110px}
.translator-note{font-size:12px;color:#77819a;text-align:center;margin-top:15px}

/* القائمة الجانبية */
.menu-button{background:#ffffff25;color:white;font-size:23px;padding:7px 14px}
.menu-overlay{position:fixed;inset:0;background:#0008;z-index:9998}
.side-menu{position:fixed;top:0;right:0;width:min(310px,85vw);height:100vh;background:white;color:#18213b;z-index:9999;padding:22px;box-shadow:-8px 0 30px #0002;overflow-y:auto}
.side-menu h3{margin-top:8px;color:#3157d5}
.side-menu button{width:100%;text-align:right;margin:5px 0;background:#f0f3fb;color:#18213b}
.side-menu .close-menu{background:#ffe9ed;color:#d94b63}
.menu-spacer{height:10px}

/* الشهادات */
.certificate{
background:white;
color:#172653;
border:9px double #c59b36;
border-radius:15px;
padding:35px 22px;
text-align:center;
max-width:850px;
margin:20px auto;
position:relative;
}
.certificate h1{color:#b18727;font-size:30px;margin:10px}
.certificate .cert-name{font-size:27px;font-weight:bold;margin:22px 0;color:#172653}
.certificate .cert-mark{font-size:48px;margin:10px}
.certificate p{line-height:2}
.certificate-footer{display:flex;justify-content:space-around;gap:15px;flex-wrap:wrap;margin-top:35px}
.cert-stamp{border:2px solid #c59b36;border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center;margin:auto;color:#b18727;font-weight:bold}

body.dark{background:#111827;color:#e5e7eb}
body.dark main{color:#e5e7eb}
body.dark .card,body.dark .panel,body.dark .exam,body.dark .hero,body.dark .translator-card{background:#1f2937;color:#e5e7eb;border-color:#374151}
body.dark .hero h1,body.dark .translator-title{color:#e5e7eb}
body.dark .hero p,body.dark .muted,body.dark footer{color:#aab4c5}
body.dark input,body.dark select,body.dark textarea{background:#111827;color:#e5e7eb;border-color:#4b5563}
body.dark .notice,body.dark .builder-box,body.dark .answer-review,body.dark .duration-item,body.dark .dialog-line{background:#273449;color:#e5e7eb;border-color:#3d4b60}
body.dark .translator-result{background:#111827;color:#e5e7eb}
body.dark .secondary{background:#33466f;color:#dbeafe}
body.dark .tag{background:#33466f;color:#dbeafe}
body.dark .side-menu{background:#1f2937;color:#e5e7eb}
body.dark .side-menu button{background:#273449;color:#e5e7eb}
body.dark .certificate{background:white;color:#172653}
@media(max-width:650px){
.hero{grid-template-columns:1fr}
.hero h1{font-size:24px}
.translator-card{padding:17px}
header{align-items:flex-start}
nav{width:100%}
nav button{flex:1}
.certificate{padding:20px 12px}
.certificate h1{font-size:23px}
.certificate .cert-name{font-size:22px}
}
@media print{
body *{visibility:hidden!important}
#printCertificate, #printCertificate *{visibility:visible!important}
#printCertificate{position:absolute;top:0;right:0;width:100%;max-width:none;margin:0}
.no-print{display:none!important}
}

.teacher-nav{position:sticky;top:8px;z-index:5;background:var(--panel,#fff);box-shadow:0 4px 16px rgba(20,35,70,.08)}
.teacher-nav .actions{display:flex;flex-wrap:wrap;gap:8px}
.teacher-nav .actions button{position:relative;margin-top:12px;padding-top:14px;overflow:visible}
.teacher-nav-badge{
 position:absolute;top:-12px;right:50%;transform:translateX(50%);
 width:23px;height:23px;border-radius:50%;background:#e53935;color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:bold;line-height:1;box-shadow:0 2px 6px #0002;
 border:2px solid #fff;z-index:2;direction:ltr
}
.teacher-nav-badge.hidden{display:none!important}
body.dark .teacher-nav-badge{border-color:#1f2937}
.teacher-section-focus{outline:3px solid rgba(45,110,220,.28);outline-offset:5px;border-radius:12px;transition:outline .3s}
@media(max-width:600px){.teacher-nav{position:static}.teacher-nav .actions button{flex:1 1 45%;min-width:135px}}


/* ================================================================
   تصميم المنصة — ملف تنسيق موحّد (يستبدل الطبقات القديمة المتعارضة)
   نقاط التوقف: الهاتف ≤ 700px | التابلت 701–1023px | الكمبيوتر ≥ 1024px
   ================================================================ */
:root{--navy:#0a2a66;--blue:#1267e8;--blue2:#0a4bc4;--gold:#ffc72d;--ink:#0b2358;--muted:#6b7a99;--line:#dbe5fb;--soft:#f1f5ff;--shadow:0 6px 18px rgba(24,60,130,.10)}
html{-webkit-text-size-adjust:100%;width:100%;overflow-x:hidden}
body{width:100%;min-width:320px;overflow-x:hidden;margin:0;background:linear-gradient(180deg,#e4edff 0,#f4f7ff 360px,#eef2ff 100%);background-attachment:fixed;color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.65}
img,svg,video,canvas{max-width:100%}
*,*::before,*::after{box-sizing:border-box}

/* ---------- أزرار موحّدة ---------- */
button{min-height:44px;padding:10px 18px;border-radius:12px;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;transition:transform .15s,filter .15s,box-shadow .15s,background .15s}
button:hover:not(:disabled){filter:brightness(1.05)}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(18,103,232,.45);outline-offset:2px}
.primary{background:linear-gradient(180deg,#2a7bf2,#0f58d6);box-shadow:0 4px 10px rgba(18,103,232,.28)}
.secondary{background:#e6eeff;color:#0d3f9f}
.danger{background:#ffe6ea;color:#c9344c}
.success{background:#e1f7ec;color:#13794f}
input,select,textarea{min-height:46px;font-size:16px}
textarea{min-height:96px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.actions>button{flex:0 1 auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card,.panel,.exam{border-radius:18px;border:1px solid #e0e8fb;box-shadow:0 3px 12px rgba(26,59,118,.07);min-width:0;max-width:100%}
.panel,.card,.exam{overflow-wrap:anywhere}

/* ---------- الهيدر ---------- */
.site-header{position:sticky;top:0;z-index:60;display:flex;flex-wrap:nowrap;justify-content:flex-start;align-items:center;gap:12px;width:100%;min-height:72px;margin:0;padding:10px max(14px,calc((100% - 1200px)/2));background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(20,50,120,.08)}
.brand-block{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0;color:var(--ink);text-decoration:none;cursor:pointer;border:0;background:none;padding:0;min-height:0;text-align:right;font-weight:inherit}
.brand-logo{width:52px;height:52px;border-radius:14px;flex:none;display:block;object-fit:cover;box-shadow:0 4px 12px rgba(10,60,170,.28)}
.brand-text{min-width:0}
.brand-text h2{margin:0;font-size:clamp(16px,2.2vw,22px);font-weight:900;line-height:1.3;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:12px;color:var(--muted);direction:ltr;text-align:right;line-height:1.3}
.header-tools{display:flex;align-items:center;gap:10px;flex:none;margin:0}
.icon-btn{width:44px;height:44px;min-height:44px;padding:0;display:grid;place-items:center;border-radius:50%;background:#e8f0ff;color:#0f3a8a;border:1px solid #cfdcfb;box-shadow:none;flex:none}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.mobile-menu{background:linear-gradient(180deg,#2a7bf2,#0f58d6)!important;color:#fff!important;border:0!important;border-radius:12px!important;box-shadow:0 4px 10px rgba(18,103,232,.3)!important}
.theme-switch .theme-sun{display:block}.theme-switch .theme-moon{display:none}
body.dark .theme-switch .theme-sun{display:none}body.dark .theme-switch .theme-moon{display:block}

/* ---------- القائمة الجانبية (تظهر بزر ☰ في كل الشاشات) ---------- */
.menu-overlay{position:fixed;inset:0;z-index:9998;background:rgba(7,23,53,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.side-menu{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);height:100vh;height:100dvh;z-index:9999;display:flex;flex-direction:column;gap:4px;padding:14px 12px 16px;background:#fff;color:var(--ink);border-radius:0;box-shadow:-10px 0 34px rgba(8,38,93,.22);overflow-y:auto;animation:menuIn .22s ease-out}
@keyframes menuIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.side-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.side-brand img{width:44px;height:44px;border-radius:12px;flex:none}
.side-brand b{display:block;font-size:15px;color:var(--navy)}
.side-brand small{display:block;font-size:11px;color:var(--muted);direction:ltr;text-align:right}
.side-brand .close-menu{margin-right:auto;width:44px;height:44px;padding:0;border-radius:50%;font-size:24px;line-height:1;background:#ffe6ea;color:#c9344c;flex:none}
.side-menu .side-link{width:100%;min-height:50px;margin:0;padding:10px 14px;display:flex;align-items:center;gap:13px;text-align:right;background:transparent;color:#0a2a66;font-size:16px;font-weight:800;border-radius:14px}
.side-menu .side-link svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.side-menu .side-link:hover{background:#eaf1ff}
.side-menu .side-link.active{background:linear-gradient(110deg,#3d91ff,#0848d2);color:#fff}
.side-menu .side-link em{font-style:normal;background:#f22e40;color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;margin-right:auto}
.side-separator{height:1px;background:var(--line);margin:8px 8px}
.theme-side .toggle-track{margin-right:auto;width:38px;height:22px;border-radius:20px;background:#cdd8f1;position:relative;flex:none}
.theme-side .toggle-track:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;right:3px;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
body.dark .theme-side .toggle-track{background:#2f7bf0}
body.dark .theme-side .toggle-track:before{transform:translateX(-16px)}
.side-goodluck{margin-top:auto;border:1px solid #d8e3ff;border-radius:18px;background:linear-gradient(145deg,#f8faff,#eaf0ff);padding:16px 8px;text-align:center;color:#0c3285;font-family:cursive;font-size:24px;font-weight:bold;font-style:italic}

/* ---------- الإطار العام ---------- */
main{display:block;width:100%;max-width:1200px;min-width:0;margin:20px auto 34px;padding:0 16px;min-height:calc(100vh - 230px)}
#home{width:100%;margin:0}
footer{margin:0;width:100%;padding:20px 14px;background:linear-gradient(100deg,#061e4b,#0d3679);color:#fff;font-size:15px;line-height:1.8}
#syncStatus{color:#b9d5ff;font-size:13px}

/* ---------- البانر (نصوص حقيقية حادة + صورة بحجمها الأصلي) ---------- */
.home-banner{position:relative;border-radius:26px;overflow:hidden;color:#fff;margin-bottom:20px;background:radial-gradient(circle at 12% 18%,rgba(70,160,255,.55),transparent 42%),radial-gradient(circle at 92% 92%,rgba(125,70,230,.45),transparent 44%),linear-gradient(120deg,#0a3fb0 0%,#0b2f8f 55%,#1a2f9c 100%);box-shadow:0 12px 28px rgba(10,50,150,.28);isolation:isolate}
.home-banner:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.14;background-image:radial-gradient(#fff 1.2px,transparent 1.4px);background-size:22px 22px}
.banner-slides{display:grid}
.banner-slide{grid-area:1/1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:26px;padding:34px 40px 50px;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.banner-slide.active{opacity:1;visibility:visible}
.banner-text{text-align:right;min-width:0}
.banner-kicker{display:inline-block;margin:0 0 12px;padding:5px 14px;border-radius:30px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:14px;font-weight:700}
.banner-text h1{margin:0 0 10px;font-size:clamp(26px,3.3vw,44px);line-height:1.35;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,20,80,.35)}
.banner-text h1 em{font-style:normal;color:var(--gold);display:block}
.banner-text p{margin:0 0 20px;font-size:clamp(16px,1.7vw,22px);font-weight:700;color:#e6f0ff;line-height:1.6}
.banner-cta{min-height:48px;padding:11px 30px;border-radius:40px;background:linear-gradient(#ffe45d,#ffbd18);color:#10285d;font-size:17px;font-weight:900;box-shadow:0 6px 16px rgba(0,20,80,.3)}
.banner-media{display:flex;align-items:center;justify-content:center;min-width:0}
.banner-media img.photo{display:block;width:100%;max-width:560px;height:auto;aspect-ratio:605/270;object-fit:cover;border-radius:20px;border:4px solid rgba(255,255,255,.85);box-shadow:0 14px 30px rgba(0,15,70,.45)}
.banner-media img.photo.small{max-width:330px;aspect-ratio:205/120}
.banner-media .logo-big{width:clamp(130px,20vw,210px);height:auto;aspect-ratio:1;border-radius:28%;box-shadow:0 0 0 8px rgba(255,255,255,.2),0 16px 34px rgba(0,15,70,.5)}
.banner-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.banner-dots button{width:28px;height:28px;min-height:28px;padding:0;background:transparent;border-radius:50%;display:grid;place-items:center;box-shadow:none}
.banner-dots button:before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid #cfe1ff;transition:.2s}
.banner-dots button.selected:before{background:#fff;border-color:#fff;transform:scale(1.2)}

/* ---------- اختصارات الصفحة الرئيسية ---------- */
.home-shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 20px}
.shortcut{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:158px;padding:16px 10px 14px;border-radius:20px;border:1px solid var(--line);color:var(--ink);text-align:center;overflow:hidden;box-shadow:0 6px 14px rgba(29,77,155,.10);min-width:0;font-weight:400}
.shortcut:hover{transform:translateY(-3px)}
.sc-icon{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(20,60,140,.14)}
.sc-icon svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.shortcut b{font-size:17px;font-weight:900;line-height:1.35}
.shortcut span{font-size:13px;color:#3f5586;line-height:1.4}
.shortcut i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1268ee;color:#fff;font-size:22px;line-height:1;margin-top:4px}
.shortcut-certs{background:linear-gradient(145deg,#faf6ff,#e0d4ff)}
.shortcut-support{background:linear-gradient(145deg,#e9fff9,#aaf1e1)}
.shortcut-teacher{background:linear-gradient(145deg,#fff4e8,#ffd6a3)}
.shortcut-students{background:linear-gradient(145deg,#eaf4ff,#b0d5ff)}
.shortcut-certs i{background:#6936e9}.shortcut-support i{background:#10b981}.shortcut-teacher i{background:#f0780b}
.shortcut-certs .sc-icon{color:#6936e9}.shortcut-support .sc-icon{color:#0d9668}.shortcut-teacher .sc-icon{color:#e06a00}.shortcut-students .sc-icon{color:#1268ee}

/* ---------- اللوحات: ملخص الملف الشخصي + الترحيب ---------- */
.home-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.home-panel{min-width:0;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.home-panel-title{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 20px;border-bottom:1px solid #e2eaff;font-size:19px;font-weight:900;color:var(--navy)}
.home-student-summary{padding:18px 20px 20px;flex:1}
.ps-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ps-avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;background:linear-gradient(145deg,#3d91ff,#0848d2);box-shadow:0 4px 12px rgba(18,103,232,.35)}
.ps-name{font-size:20px;font-weight:900;color:#1458c7;line-height:1.35;overflow-wrap:anywhere}
.ps-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ps-chips span{background:#edf2ff;color:#1d4fb8;border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700}
.ps-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 16px}
.ps-stat{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}
.ps-stat b{display:block;font-size:22px;line-height:1.3;color:#1458c7}
.ps-stat span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.ps-empty{text-align:center;padding:10px 0}
.ps-empty p{margin:0 0 14px}
.home-student-summary>button,.ps-empty button,.ps-btn{width:100%}
.welcome-panel{background:radial-gradient(circle at 22% 50%,#1b62f6,#0a2f9f 46%,#071d68 100%);color:#fff;border:0;flex-direction:row;align-items:center;justify-content:center;gap:24px;padding:24px;position:relative}
.welcome-panel:before{content:"";position:absolute;width:360px;height:90px;border:20px solid rgba(57,140,255,.25);border-radius:50%;transform:rotate(-18deg);bottom:-60px;left:-50px;pointer-events:none}
.welcome-logo{width:112px;height:112px;border-radius:26px;flex:none;border:4px solid rgba(255,255,255,.85);box-shadow:0 0 0 6px rgba(255,255,255,.18),0 10px 28px rgba(0,20,90,.5);position:relative;z-index:1}
.welcome-copy{position:relative;z-index:1;text-align:center;min-width:0}
.welcome-copy h2{margin:0 0 6px;font-size:21px;color:#fff}
.welcome-copy strong{display:block;color:var(--gold);font-size:28px;line-height:1.35;margin-bottom:4px}
.welcome-copy b{font-size:16px}
.welcome-copy p{margin:14px 0 0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:30px;padding:9px 16px;font-size:14px;font-weight:700}

/* ---------- لوحة المدرس والمجموعات ---------- */
.teacher-nav{position:static;margin-bottom:18px}
.teacher-nav .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.teacher-nav .actions button{margin-top:0;padding:12px 10px;min-width:0;width:100%;white-space:normal;position:relative}
.teacher-nav-badge{top:-8px;right:auto;left:8px;transform:none}
.group-manager{border:1px solid #dce6ff;background:#fbfcff}
.group-create-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.groups-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
.group-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eef3ff;border:1px solid #dce6ff;padding:12px;border-radius:12px;min-width:0}
.group-chip small{display:block;color:#71809b;margin-top:4px}
.group-chip button{flex:none}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}

/* ---------- نظام الواجبات ---------- */
.hw-wrap{max-w
