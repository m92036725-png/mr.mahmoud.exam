<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1448d6">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مستر محمود">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستر محمود خاطر | English</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fc;color:#18213b;font-family:Tahoma,Arial;transition:background .25s,color .25s}
header{background:linear-gradient(120deg,#101b3d,#3157d5);color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{background:#28c6c9;padding:12px 17px;border-radius:14px;font-size:24px;font-weight:bold}
header h2{margin:0;font-size:19px}
nav{display:flex;gap:7px;flex-wrap:wrap}
button{border:0;padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:bold;font-family:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
nav button{background:#ffffff20;color:white}
.primary{background:#3157d5;color:white}
.secondary{background:#e9efff;color:#3157d5}
.danger{background:#ffe9ed;color:#d94b63}
.success{background:#e7f8ef;color:#16845b}
main{max-width:1100px;margin:28px auto;padding:0 15px}
.hero{background:white;padding:30px;border-radius:22px;display:grid;grid-template-columns:1.4fr .8fr;gap:20px;align-items:center}
.hero h1{font-size:30px;color:#101b3d}
.hero p,.muted{color:#77819a}
.hero-art{background:linear-gradient(140deg,#172653,#3157d5);color:white;text-align:center;padding:30px;border-radius:20px}
.hero-art strong{font-size:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin:22px 0}
.card,.panel,.exam{background:white;padding:20px;border-radius:16px;border:1px solid #e7ebf5;margin-bottom:15px}
.hidden{display:none!important}
label{display:block;margin:12px 0 6px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #dce2ef;border-radius:10px;font:inherit;background:white;color:#18213b}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{background:#edf1ff;color:#3157d5;padding:5px 10px;border-radius:20px;font-size:12px}
.stat{font-size:30px;color:#3157d5;font-weight:bold}
.question{border:1px solid #e5eaf5;padding:16px;border-radius:13px;margin:15px 0}
.option{display:flex;gap:10px;align-items:center;font-weight:normal}
.option input{width:auto}
.notice{background:#edf3ff;padding:13px;border-radius:10px;margin:12px 0}
.passage{background:#fff8e8;padding:15px;border-radius:12px;line-height:1.9;margin:12px 0}
footer{text-align:center;padding:25px;color:#77819a}
hr{border:0;border-top:1px solid #e7ebf5;margin:18px 0}
.small{font-size:13px;color:#77819a}
.duration-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.duration-item{background:#f7f8fc;padding:10px;border-radius:10px}
.answer-review{background:#f7f8fc;padding:13px;border-radius:10px;margin:10px 0}
.builder-box{background:#f7f8fc;padding:14px;border-radius:12px;margin:12px 0;border:1px solid #e5eaf5}
.dialog-line{background:white;padding:12px;border:1px solid #e5eaf5;border-radius:10px;margin:10px 0}
.word-choice{display:inline-block;background:#e9efff;color:#3157d5;padding:8px 12px;margin:4px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.word-choice.selected{border-color:#3157d5;background:#dce6ff}
.dialog-person{font-weight:bold;color:#3157d5}

/* المترجم */
.translator-card{background:white;padding:25px;border-radius:20px;border:1px solid #e7ebf5;max-width:750px;margin:25px auto;box-shadow:0 8px 25px #18213b0a}
.translator-title{color:#172653;text-align:center;font-size:26px}
.translator-ribbon{display:inline-block;background:#e53950;color:white;padding:6px 18px;border-radius:6px;font-size:12px;font-weight:bold;margin:8px;transform:rotate(-4deg)}
.translator-result{background:#f3f6ff;padding:18px;border-radius:12px;min-height:100px;margin-top:15px;font-size:19px;line-height:1.8;color:#172653;white-space:pre-wrap;overflow-wrap:anywhere}
.translator-switch{background:#edf1ff;color:#3157d5;font-size:20px;padding:9px 17px}
.translator-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.translator-actions button{flex:1;min-width:110px}
.translator-note{font-size:12px;color:#77819a;text-align:center;margin-top:15px}

/* القائمة الجانبية */
.menu-button{background:#ffffff25;color:white;font-size:23px;padding:7px 14px}
.menu-overlay{position:fixed;inset:0;background:#0008;z-index:9998}
.side-menu{position:fixed;top:0;right:0;width:min(310px,85vw);height:100vh;background:white;color:#18213b;z-index:9999;padding:22px;box-shadow:-8px 0 30px #0002;overflow-y:auto}
.side-menu h3{margin-top:8px;color:#3157d5}
.side-menu button{width:100%;text-align:right;margin:5px 0;background:#f0f3fb;color:#18213b}
.side-menu .close-menu{background:#ffe9ed;color:#d94b63}
.menu-spacer{height:10px}

/* الشهادات */
.certificate{
background:white;
color:#172653;
border:9px double #c59b36;
border-radius:15px;
padding:35px 22px;
text-align:center;
max-width:850px;
margin:20px auto;
position:relative;
}
.certificate h1{color:#b18727;font-size:30px;margin:10px}
.certificate .cert-name{font-size:27px;font-weight:bold;margin:22px 0;color:#172653}
.certificate .cert-mark{font-size:48px;margin:10px}
.certificate p{line-height:2}
.certificate-footer{display:flex;justify-content:space-around;gap:15px;flex-wrap:wrap;margin-top:35px}
.cert-stamp{border:2px solid #c59b36;border-radius:50%;width:90px;height:90px;display:flex;align-items:center;justify-content:center;margin:auto;color:#b18727;font-weight:bold}

body.dark{background:#111827;color:#e5e7eb}
body.dark main{color:#e5e7eb}
body.dark .card,body.dark .panel,body.dark .exam,body.dark .hero,body.dark .translator-card{background:#1f2937;color:#e5e7eb;border-color:#374151}
body.dark .hero h1,body.dark .translator-title{color:#e5e7eb}
body.dark .hero p,body.dark .muted,body.dark footer{color:#aab4c5}
body.dark input,body.dark select,body.dark textarea{background:#111827;color:#e5e7eb;border-color:#4b5563}
body.dark .notice,body.dark .builder-box,body.dark .answer-review,body.dark .duration-item,body.dark .dialog-line{background:#273449;color:#e5e7eb;border-color:#3d4b60}
body.dark .translator-result{background:#111827;color:#e5e7eb}
body.dark .secondary{background:#33466f;color:#dbeafe}
body.dark .tag{background:#33466f;color:#dbeafe}
body.dark .side-menu{background:#1f2937;color:#e5e7eb}
body.dark .side-menu button{background:#273449;color:#e5e7eb}
body.dark .certificate{background:white;color:#172653}
@media(max-width:650px){
.hero{grid-template-columns:1fr}
.hero h1{font-size:24px}
.translator-card{padding:17px}
header{align-items:flex-start}
nav{width:100%}
nav button{flex:1}
.certificate{padding:20px 12px}
.certificate h1{font-size:23px}
.certificate .cert-name{font-size:22px}
}
@media print{
body *{visibility:hidden!important}
#printCertificate, #printCertificate *{visibility:visible!important}
#printCertificate{position:absolute;top:0;right:0;width:100%;max-width:none;margin:0}
.no-print{display:none!important}
}

.teacher-nav{position:sticky;top:8px;z-index:5;background:var(--panel,#fff);box-shadow:0 4px 16px rgba(20,35,70,.08)}
.teacher-nav .actions{display:flex;flex-wrap:wrap;gap:8px}
.teacher-nav .actions button{position:relative;margin-top:12px;padding-top:14px;overflow:visible}
.teacher-nav-badge{
 position:absolute;top:-12px;right:50%;transform:translateX(50%);
 width:23px;height:23px;border-radius:50%;background:#e53935;color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:bold;line-height:1;box-shadow:0 2px 6px #0002;
 border:2px solid #fff;z-index:2;direction:ltr
}
.teacher-nav-badge.hidden{display:none!important}
body.dark .teacher-nav-badge{border-color:#1f2937}
.teacher-section-focus{outline:3px solid rgba(45,110,220,.28);outline-offset:5px;border-radius:12px;transition:outline .3s}
@media(max-width:600px){.teacher-nav{position:static}.teacher-nav .actions button{flex:1 1 45%;min-width:135px}}


/* ===== التصميم البصري الجديد لمنصة مستر محمود خاطر ===== */
:root{--navy:#08285f;--navy2:#0d3c83;--blue:#1267e8;--gold:#ffc72d;--ink:#0b285d;--paper:#f3f6ff;--line:#dce6ff}
body{background:radial-gradient(ellipse at 50% 0%,#e5efff 0,#f7f8ff 52%,#eef2ff 100%);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
.site-header{height:122px;padding:12px 24px;background:linear-gradient(100deg,#061d4b 0%,#0d3678 58%,#08265d 100%);position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 5px 18px #102e6540;overflow:hidden}
.site-header:before{content:"";position:absolute;inset:0 22% 0 18%;opacity:.18;background:linear-gradient(90deg,transparent,#7bb7ff,transparent);pointer-events:none}
.brand-block,.header-tools,.header-motto{position:relative;z-index:1}
.brand-block{display:flex;align-items:center;gap:17px;color:#fff;min-width:320px}
.brand-block h2{font-size:30px;margin:0 0 6px;font-weight:900;white-space:nowrap}
.brand-block b{font-size:21px;color:#ffc72d}
.brand-seal{width:100px;height:100px;border-radius:50%;background:#fff;border:5px solid #e4efff;box-shadow:0 0 0 3px #c5d8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1262c9;position:relative;flex:none}
.brand-seal span{font-size:25px;line-height:1}
.brand-seal strong{font-size:37px;line-height:1;font-weight:1000}
.brand-seal small{color:#d9a51b;line-height:1}
.header-motto{color:white;font-size:21px;font-weight:bold;text-align:center;flex:1}
.header-motto span{display:block;width:230px;height:13px;border-top:5px solid var(--gold);border-radius:50%;transform:rotate(-4deg);margin:14px auto 0}
.header-tools{display:flex;align-items:center;gap:14px;direction:ltr}
.header-tools button{color:white;border-radius:28px;padding:10px 17px;font-size:18px}
.theme-switch{background:#ffffff20;border:1px solid #ffffff55;font-size:21px!important}
.theme-switch span{margin-left:7px}
.bell-button{background:transparent;font-size:30px!important;position:relative}
.bell-button i{position:absolute;top:-3px;right:3px;background:#ec263a;border:2px solid #fff;border-radius:50%;font-size:12px;font-style:normal;width:23px;height:23px;display:grid;place-items:center}
.header-home,.header-support{background:linear-gradient(#3188ff,#0751ca);box-shadow:0 4px 12px #001b5480;white-space:nowrap}.header-support{background:linear-gradient(#18a7a0,#087d85)}
.mobile-menu{display:none}
main{max-width:none;width:auto;margin:28px 0 40px;padding:0 28px 0 28px;margin-right:248px;min-height:calc(100vh - 205px)}
